<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิจัยและการใช้หลักฐานเชิงประจักษ์ทางการพยาบาล · 1100500107</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15212b;
  --ink-soft:#42505c;
  --paper:#f6f3ec;
  --paper-2:#efeae0;
  --card:#fffdf8;
  --line:#ddd5c7;
  --teal:#0f6b6b;
  --teal-deep:#0a4f4f;
  --teal-wash:#e3efed;
  --clay:#c0603a;
  --clay-wash:#f6e4da;
  --gold:#c69a3e;
  --plum:#6b2e5f;
  --ok:#1f7a52;
  --ok-wash:#e0f0e5;
  --no:#b23a48;
  --no-wash:#f8e2e2;
  --shadow:0 1px 2px rgba(21,33,43,.06),0 8px 26px rgba(21,33,43,.07);
  --shadow-lg:0 2px 6px rgba(21,33,43,.08),0 22px 50px rgba(21,33,43,.13);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.en{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:-.01em}
h1,h2,h3,.display{font-family:"Fraunces",Georgia,serif}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:300px;flex-shrink:0;background:var(--ink);color:#e9e4d8;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:26px 0 40px;
}
.rail::-webkit-scrollbar{width:8px}
.rail::-webkit-scrollbar-thumb{background:#33424e;border-radius:8px}
.rail-head{padding:0 24px 20px;border-bottom:1px solid #2b3742;margin-bottom:14px}
.rail-code{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.rail-title{font-family:"Fraunces";font-size:21px;font-weight:600;line-height:1.25;margin-top:8px;color:#fff}
.rail-sub{font-size:12.5px;color:#9aa6 af;color:#9aa6af;margin-top:8px}
.progress-mini{margin-top:16px;height:6px;background:#2b3742;border-radius:6px;overflow:hidden}
.progress-mini>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .5s}
.progress-label{font-size:11px;color:#8a97a1;margin-top:7px;letter-spacing:.02em}

.nav-chapter{margin:4px 0}
.nav-ch-btn{
  width:100%;text-align:right;background:none;border:none;color:#cdd5da;
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  padding:11px 24px;display:flex;align-items:center;gap:11px;justify-content:flex-start;
  transition:background .15s,color .15s;direction:rtl;
}
.nav-ch-btn:hover{background:#222d37;color:#fff}
.nav-ch-btn .num{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
  width:25px;height:25px;border-radius:7px;background:#2b3742;color:var(--gold);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;direction:ltr;
}
.nav-ch-btn.locked{color:#65727c;cursor:default}
.nav-ch-btn.locked:hover{background:none}
.nav-ch-btn.locked .num{background:#222d37;color:#5a6770}
.nav-ch-btn .lockico{margin-right:auto;font-size:12px;opacity:.6;direction:ltr}
.nav-topics{display:none;padding:2px 24px 8px 24px}
.nav-chapter.open .nav-topics{display:block}
.nav-topic{
  display:flex;align-items:center;gap:9px;direction:rtl;text-align:right;
  width:100%;background:none;border:none;color:#9aa6af;font-family:inherit;
  font-size:13px;cursor:pointer;padding:7px 10px 7px 0;border-radius:8px;transition:.15s;
}
.nav-topic:hover{color:#fff;background:#222d37}
.nav-topic.active{color:#fff;background:var(--teal-deep)}
.nav-topic .dot{width:7px;height:7px;border-radius:50%;background:#42505c;flex-shrink:0}
.nav-topic.done .dot{background:var(--gold)}
.nav-topic.active .dot{background:#fff}

/* ---------- main ---------- */
.main{flex:1;min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(246,243,236,.85);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:14px 40px;display:flex;align-items:center;gap:16px;
}
.crumb{font-size:13px;color:var(--ink-soft)}
.crumb b{color:var(--ink)}
.topbar .spacer{flex:1}
.menu-toggle{display:none}
.view{max-width:920px;margin:0 auto;padding:46px 40px 120px}

/* ---------- hero ---------- */
.hero{padding:30px 0 10px}
.hero-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay);font-weight:600}
.hero h1{font-size:clamp(34px,5vw,52px);font-weight:700;line-height:1.08;margin:18px 0;letter-spacing:-.01em}
.hero .lede{font-size:18px;color:var(--ink-soft);max-width:640px}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:100px;padding:7px 15px;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow)}
.chip b{color:var(--ink)}
.hero-cta{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap}

/* chapter cards on home */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:14px}
.ch-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);cursor:pointer;transition:transform .18s,box-shadow .18s;
  position:relative;overflow:hidden;text-align:right;display:flex;flex-direction:column;
}
.ch-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ch-card.locked{cursor:default;opacity:.72}
.ch-card.locked:hover{transform:none;box-shadow:var(--shadow)}
.ch-card .big-num{font-family:"Fraunces";font-size:46px;font-weight:600;color:var(--teal);line-height:1}
.ch-card.locked .big-num{color:var(--line)}
.ch-card h3{font-size:18px;margin:12px 0 8px;font-weight:600;line-height:1.3}
.ch-card p{font-size:13.5px;color:var(--ink-soft);flex:1}
.ch-card .foot{margin-top:16px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--teal);font-weight:600}
.ch-card .badge{font-size:11px;padding:4px 10px;border-radius:100px;font-weight:600;display:inline-block}
.badge-full{background:var(--teal-wash);color:var(--teal-deep)}
.badge-soon{background:var(--paper-2);color:var(--ink-soft)}

/* ---------- topic view ---------- */
.topic-head{margin-bottom:8px}
.topic-kicker{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--clay);font-weight:600;letter-spacing:.04em}
.topic-head h2{font-size:clamp(26px,3.5vw,38px);font-weight:700;line-height:1.14;margin:10px 0;letter-spacing:-.01em}
.topic-head .en-sub{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink-soft);font-weight:500}

/* phase tabs */
.phases{display:flex;gap:6px;background:var(--paper-2);padding:6px;border-radius:14px;margin:26px 0 8px;position:sticky;top:62px;z-index:15;box-shadow:var(--shadow)}
.phase-tab{
  flex:1;border:none;background:none;font-family:inherit;cursor:pointer;
  padding:11px 8px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:.18s;
}
.phase-tab .ph-en{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;opacity:.7;font-weight:500}
.phase-tab[data-on="1"]{background:var(--card);color:var(--teal-deep);box-shadow:var(--shadow)}
.phase-tab:hover:not([data-on="1"]){color:var(--ink)}

.phase-panel{display:none;padding-top:22px;animation:fade .35s}
.phase-panel.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* generic content blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:18px}
.card h4{font-size:18px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.card h4 .ic{width:30px;height:30px;border-radius:9px;background:var(--teal-wash);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.prose p{margin-bottom:12px;color:var(--ink-soft)}
.prose strong{color:var(--ink);font-weight:600}
.lead-in{font-size:16.5px;color:var(--ink-soft);margin-bottom:22px;max-width:680px}

/* objective box */
.obj-box{background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#eafaf6;border-radius:var(--radius);padding:26px 28px;margin-bottom:8px;box-shadow:var(--shadow)}
.obj-box .label{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9fe3d4;font-weight:600}
.obj-box h4{font-family:"Fraunces";font-size:21px;margin:8px 0 16px;color:#fff}
.obj-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.obj-list li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.obj-list .llo{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:7px;flex-shrink:0;margin-top:3px;letter-spacing:.02em}
.obj-target{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2);font-size:14px;color:#cdeee6}
.obj-target b{color:#fff}

/* warmup / activate prior knowledge */
.warm{background:var(--clay-wash);border:1px solid #e9cbbb;border-radius:var(--radius);padding:24px 26px;margin-bottom:18px}
.warm .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);font-weight:600}
.warm h4{font-size:18px;margin:6px 0 14px;font-family:"Fraunces";color:var(--ink)}
.warm-q{background:var(--card);border-radius:12px;padding:15px 18px;margin-bottom:10px;font-size:14.5px;cursor:pointer;border:1px solid transparent;transition:.18s}
.warm-q:hover{border-color:var(--clay)}
.warm-q .qrow{display:flex;gap:10px;align-items:flex-start}
.warm-q .qmark{color:var(--clay);font-weight:700;flex-shrink:0}
.warm-q .reveal{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-soft)}
.warm-q.open .reveal{display:block;animation:fade .25s}
.warm-q .hint{font-size:11px;color:var(--clay);margin-top:8px;font-weight:600}

/* roadmap */
.roadmap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 22px}
.rm-step{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:12.5px;text-align:center;min-width:78px;box-shadow:var(--shadow)}
.rm-step .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft)}
.rm-step .t{font-weight:600;font-size:12.5px}
.rm-step.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.rm-step.on .n{color:#9fe3d4}
.rm-arrow{color:var(--line);font-size:16px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:18px}
table.data{width:100%;border-collapse:collapse;background:var(--card);font-size:13.5px;min-width:520px}
table.data th{background:var(--teal-deep);color:#fff;font-weight:600;text-align:right;padding:12px 14px;font-size:13px}
table.data td{padding:11px 14px;border-top:1px solid var(--line);color:var(--ink-soft);vertical-align:top}
table.data tr:nth-child(even) td{background:var(--paper)}
table.data td b,table.data td strong{color:var(--ink)}
.mono-cell{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--teal-deep);font-weight:600}

/* concept grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.ccard .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:11px;background:var(--clay-wash);color:var(--clay)}
.ccard h5{font-size:15px;font-weight:600;margin-bottom:3px}
.ccard .en-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);margin-bottom:8px;font-weight:500}
.ccard p{font-size:13px;color:var(--ink-soft)}

/* FINER / acronym strip */
.acro{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.acro-row{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 18px;box-shadow:var(--shadow)}
.acro-letter{font-family:"Fraunces";font-size:30px;font-weight:700;color:var(--teal);line-height:1;width:38px;flex-shrink:0;text-align:center}
.acro-body h5{font-size:15px;font-weight:600}
.acro-body .en-tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);font-weight:500}
.acro-body p{font-size:13px;color:var(--ink-soft);margin-top:4px}

/* callout */
.callout{border-radius:14px;padding:16px 20px;margin-bottom:18px;font-size:14px;display:flex;gap:13px;align-items:flex-start}
.callout .cic{font-size:18px;flex-shrink:0;line-height:1.4}
.callout.tip{background:var(--teal-wash);border:1px solid #bcdbd4;color:var(--teal-deep)}
.callout.warn{background:var(--clay-wash);border:1px solid #e9cbbb;color:#8a3d1f}
.callout.gold{background:#f7eed4;border:1px solid #e6d29a;color:#7a5e1c}
.callout b{font-weight:700}

/* alignment chain */
.chain{display:flex;flex-direction:column;gap:0;margin-bottom:18px}
.chain-node{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 18px;box-shadow:var(--shadow)}
.chain-node .lab{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--clay);font-weight:600;margin-bottom:5px}
.chain-node p{font-size:14px;color:var(--ink-soft)}
.chain-arrow{text-align:center;color:var(--teal);font-size:20px;padding:5px 0;font-weight:700}

/* archery / target visual */
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.tg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.tg svg{width:84px;height:84px;margin-bottom:8px}
.tg h5{font-size:14px;font-weight:600;margin-bottom:4px}
.tg p{font-size:12px;color:var(--ink-soft)}

/* ---------- quiz ---------- */
.quiz-intro{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);margin-bottom:18px;text-align:center}
.quiz-intro h4{font-family:"Fraunces";font-size:22px;justify-content:center;margin-bottom:8px}
.quiz-intro p{color:var(--ink-soft);font-size:14.5px;max-width:520px;margin:0 auto 18px}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow);margin-bottom:16px}
.q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.q-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--clay);font-weight:600;letter-spacing:.04em}
.q-tag{font-size:11px;background:var(--paper-2);color:var(--ink-soft);padding:4px 11px;border-radius:100px;font-weight:600}
.q-stem{font-size:16.5px;font-weight:600;margin:8px 0 18px;line-height:1.55}
.opt{display:block;width:100%;text-align:right;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 18px;margin-bottom:10px;font-family:inherit;font-size:14.5px;cursor:pointer;transition:.15s;color:var(--ink);position:relative}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-wash)}
.opt:disabled{cursor:default}
.opt .olbl{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--teal-deep);margin-left:8px}
.opt.correct{background:var(--ok-wash);border-color:var(--ok);color:#0e4d31}
.opt.correct .olbl{color:var(--ok)}
.opt.wrong{background:var(--no-wash);border-color:var(--no);color:#7a2630}
.opt.wrong .olbl{color:var(--no)}
.opt .mark{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:16px}
.explain{display:none;margin-top:6px;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.6;animation:fade .3s}
.explain.show{display:block}
.explain.right{background:var(--ok-wash);border:1px solid #b4ddc4}
.explain.righ t,.explain.right b{color:#0e4d31}
.explain.miss{background:#fdf4e3;border:1px solid #ecd9a8}
.explain .etag{font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.explain.right .etag{color:var(--ok)}
.explain.miss .etag{color:#9a7414}
.explain .lloref{font-family:"IBM Plex Mono",monospace;font-size:11px;background:rgba(0,0,0,.05);padding:2px 8px;border-radius:6px;margin-top:9px;display:inline-block;color:var(--ink-soft)}

.btn{font-family:inherit;font-weight:600;font-size:14.5px;border:none;border-radius:12px;padding:13px 24px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--teal-deep);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--teal);transform:translateY(-1px)}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-deep)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* quiz result */
.result{background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;border-radius:var(--radius);padding:36px;text-align:center;box-shadow:var(--shadow-lg);margin-bottom:18px}
.result .score-ring{width:130px;height:130px;margin:0 auto 16px}
.result h3{font-family:"Fraunces";font-size:26px;margin-bottom:6px;color:#fff}
.result p{color:#cdeee6;font-size:15px;max-width:460px;margin:0 auto}
.result .pct{font-family:"Fraunces";font-size:40px;font-weight:700}
.breakdown{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.bd{background:rgba(255,255,255,.14);border-radius:12px;padding:12px 18px;font-size:13px}
.bd b{display:block;font-family:"Fraunces";font-size:22px}

/* assignment bridge */
.bridge{background:#f7eed4;border:1px solid #e6d29a;border-radius:var(--radius);padding:24px 26px;margin-bottom:18px}
.bridge .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9a7414;font-weight:600}
.bridge h4{font-family:"Fraunces";font-size:19px;margin:6px 0 12px;color:var(--ink)}
.bridge ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.bridge li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-soft)}
.bridge li .ck{color:var(--gold);font-weight:700;flex-shrink:0}

/* locked chapter view */
.locked-view{text-align:center;padding:70px 20px}
.locked-view .lic{font-size:46px;margin-bottom:18px;opacity:.4}
.locked-view h2{font-size:26px;margin-bottom:12px}
.locked-view p{color:var(--ink-soft);max-width:480px;margin:0 auto 24px}
.outline-list{max-width:560px;margin:0 auto;text-align:right}
.outline-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.outline-item .on{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--teal);font-weight:600;flex-shrink:0}
.outline-item .ot{font-size:14px;text-align:right;flex:1}
.outline-item . ob{font-size:11px}

.footer-note{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}

/* responsive */
@media(max-width:860px){
  .rail{position:fixed;right:-300px;transition:right .25s;z-index:50;box-shadow:-10px 0 40px rgba(0,0,0,.3)}

<script>
/* ============================================================
   app.js — เครื่องยนต์แพลตฟอร์มการเรียนรู้
   ============================================================ */

const state = {
  view: "home",       // home | topic | locked
  topicId: null,
  chId: null,
  phase: "before",
  done: {},           // topicId -> true (เมื่อทำ quiz จบ)
  quiz: { idx: 0, answers: [], topicId: null }
};

const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
const chById = id => COURSE.chapters.find(c=>c.id===id);
const topicsOf = ch => (ch.topics||[]).map(t=>COURSE.topics[t]);
// resolve a topic by its display code (e.g. "2.1") OR its key (e.g. "t21")
const keyByCode = {};
Object.keys(COURSE.topics).forEach(k=>{ keyByCode[COURSE.topics[k].code]=k; });
const topicByCode = code => COURSE.topics[code] || COURSE.topics[keyByCode[code]];

/* ---------------- NAV TREE ---------------- */
function buildNav(){
  const tree = $("#navTree");
  tree.innerHTML = "";
  COURSE.chapters.forEach(ch=>{
    const wrap = el("div","nav-chapter");
    wrap.dataset.ch = ch.id;
    const locked = ch.status!=="full";
    const btn = el("button", "nav-ch-btn"+(locked?" locked":""));
    btn.innerHTML = `<span class="num">${ch.num}</span><span style="text-align:right">${ch.title}</span>`
      + (locked?`<span class="lockico">🔒</span>`:`<span class="lockico">▾</span>`);
    btn.onclick = ()=>{
      if(locked){ openLocked(ch.id); closeMobile(); return; }
      wrap.classList.toggle("open");
    };
    wrap.appendChild(btn);

    if(!locked){
      const tlist = el("div","nav-topics");
      topicsOf(ch).forEach(tp=>{
        const tb = el("button","nav-topic");
        tb.dataset.topic = tp.code;
        tb.innerHTML = `<span class="dot"></span><span>${tp.code} ${tp.title}</span>`;
        tb.onclick = ()=>{ openTopic(tp.code); closeMobile(); };
        tlist.appendChild(tb);
      });
      wrap.appendChild(tlist);
    }
    tree.appendChild(wrap);
  });
}

function refreshNavState(){
  document.querySelectorAll(".nav-topic").forEach(b=>{
    const code=b.dataset.topic;
    b.classList.toggle("active", state.view==="topic" && state.topicId===code);
    b.classList.toggle("done", !!state.done[code]);
  });
  // open the chapter containing active topic
  if(state.view==="topic"){
    const tp=topicByCode(state.topicId);
    document.querySelectorAll(".nav-chapter").forEach(w=>{
      if(w.dataset.ch===tp.ch) w.classList.add("open");
    });
  }
}

/* ---------------- PROGRESS ---------------- */
function updateProgress(){
  const all = Object.keys(COURSE.topics).length;
  const fin = Object.values(state.done).filter(Boolean).length;
  const pct = all? Math.round(fin/all*100):0;
  $("#progBar").style.width = pct+"%";
  $("#progLabel").textContent = `ความคืบหน้า ${pct}% · ทำแบบฝึกหัดแล้ว ${fin}/${all} หัวข้อ`;
}

/* ---------------- HOME ---------------- */
function openHome(){
  state.view="home"; state.topicId=null;
  $("#crumb").innerHTML="<b>หน้าหลัก</b>";
  const v=$("#view"); v.innerHTML="";

  const hero=el("div","hero");
  hero.innerHTML=`
    <div class="hero-eyebrow">รายวิชา 1100500107 · ปีการศึกษา 2569</div>
    <h1>วิจัยและการใช้หลักฐาน<br>เชิงประจักษ์ทางการพยาบาล</h1>
    <p class="lede">แพลตฟอร์มเรียนรู้ด้วยตนเอง ออกแบบให้คุณเรียนได้ทุกที่ทุกเวลา — เตรียมตัวก่อนเข้าชั้น เรียนรู้ระหว่างชั้น และทบทวนหลังเรียนด้วยแบบฝึกหัดพร้อมเฉลยอธิบาย</p>
    <div class="hero-meta">
      <span class="chip">📚 <b>4</b> บทเรียน</span>
      <span class="chip">🎯 <b>9</b> หัวข้อย่อย (บทที่ 2)</span>
      <span class="chip">✍️ <b>เป้าหมาย:</b> โครงร่างการวิจัย (รายงานฉบับที่ 3)</span>
      <span class="chip">🧭 เรียนรู้ 3 ระยะ: ก่อน–ระหว่าง–หลังเรียน</span>
    </div>`;
  v.appendChild(hero);

  const intro=el("div","card");
  intro.style.marginTop="34px";
  intro.innerHTML=`
    <h4><span class="ic">🧭</span>วิธีใช้แพลตฟอร์มนี้</h4>
    <div class="prose">
      <p>แต่ละหัวข้อในบทที่ 2 แบ่งการเรียนรู้เป็น <strong>3 ระยะ</strong> เพื่อให้เกิดการเรียนรู้ที่ลึกและต่อเนื่อง:</p>

/* ---------------- TOPIC VIEW ---------------- */
function openTopic(code){
  const tp=topicByCode(code);
  state.view="topic"; state.topicId=code; state.chId=tp.ch; state.phase="before";
  const ch=chById(tp.ch);
  $("#crumb").innerHTML=`<b>บทที่ ${ch.num}</b> · ${tp.code} ${tp.title}`;

  const v=$("#view"); v.innerHTML="";

  // head
  const head=el("div","topic-head");
  head.innerHTML=`
    <div class="topic-kicker">หัวข้อ ${tp.code}</div>
    <h2>${tp.title}</h2>
    <div class="en-sub">${tp.en}</div>`;
  v.appendChild(head);

  // roadmap
  v.appendChild(buildRoadmap(tp));

  // phase tabs
  const tabs=el("div","phases");
  const phaseDefs=[
    {k:"before",th:"ก่อนเรียน",en:"BEFORE"},
    {k:"during",th:"ระหว่างเรียน",en:"DURING"},
    {k:"after",th:"หลังเรียน · แบบฝึกหัด",en:"AFTER · QUIZ"}
  ];
  phaseDefs.forEach(p=>{
    const t=el("button","phase-tab");
    t.dataset.k=p.k;
    t.innerHTML=`<span>${p.th}</span><span class="ph-en">${p.en}</span>`;
    t.onclick=()=>switchPhase(p.k);
    tabs.appendChild(t);
  });
  v.appendChild(tabs);

  // panels
  const pBefore=el("div","phase-panel"); pBefore.dataset.k="before"; renderBefore(pBefore,tp);
  const pDuring=el("div","phase-panel"); pDuring.dataset.k="during"; renderDuring(pDuring,tp);
  const pAfter=el("div","phase-panel"); pAfter.dataset.k="after"; renderAfter(pAfter,tp);
  v.appendChild(pBefore); v.appendChild(pDuring); v.appendChild(pAfter);

  switchPhase("before");
  refreshNavState();
  window.scrollTo(0,0);
}

function buildRoadmap(tp){
  const labels=["ปัญหา & ตัวแปร","ทบทวนวรรณกรรม","กรอบแนวคิด","ออกแบบ & สุ่ม","เครื่องมือ & เก็บข้อมูล","วิเคราะห์ & จัดการ"];
  const rm=el("div","roadmap");
  labels.forEach((l,i)=>{
    const step=el("div","rm-step"+((i+1)===tp.roadmap?" on":""));
    step.innerHTML=`<div class="n">${i+1}</div><div class="t">${l}</div>`;
    rm.appendChild(step);
    if(i<labels.length-1){ const a=el("span","rm-arrow","›"); rm.appendChild(a); }
  });
  return rm;
}

function switchPhase(k){
  state.phase=k;
  document.querySelectorAll(".phase-tab").forEach(t=>t.setAttribute("data-on", t.dataset.k===k?"1":"0"));
  document.querySelectorAll(".phase-panel").forEach(p=>p.classList.toggle("show", p.dataset.k===k));
  const tabs=$(".phases"); if(tabs){ const top=tabs.getBoundingClientRect().top; if(top<70) tabs.scrollIntoView({block:"start"}); }
}

/* ---------------- AFTER / QUIZ ---------------- */
function renderAfter(root,tp){
  root.innerHTML="";
  state.quiz={ idx:0, answers:new Array(tp.quiz.length).fill(null), topicId:tp.code };

  const intro=el("div","quiz-intro");
  intro.innerHTML=`
    <h4>แบบฝึกหัดทบทวน</h4>
    <p>แบบฝึกหัดเชิงความเข้าใจ ${tp.quiz.length} ข้อ — เลือกคำตอบแล้วระบบจะเฉลยพร้อมคำอธิบายทันที ไม่นับคะแนนเก็บ ใช้เพื่อตรวจสอบความเข้าใจของตนเอง</p>
    <button class="btn btn-primary" id="startQuiz">เริ่มทำแบบฝึกหัด</button>`;
  root.appendChild(intro);

  const host=el("div"); host.id="quizHost"; root.appendChild(host);

  intro.querySelector("#startQuiz").onclick=()=>{ intro.style.display="none"; renderQ(host,tp); };
}

function renderQ(host,tp){
  const i=state.quiz.idx;
  const q=tp.quiz[i];
  host.innerHTML="";
  const card=el("div","q-card");
  card.innerHTML=`
    <div class="q-top">
      <span class="q-count">ข้อ ${i+1} / ${tp.quiz.length}</span>
      <span class="q-tag">${q.tag}</span>
    </div>
    <div class="q-stem">${q.stem}</div>`;
  const optWrap=el("div");
  const letters=["ก","ข","ค","ง","จ"];
  q.opts.forEach((o,oi)=>{
    const btn=el("button","opt");
    btn.innerHTML=`<span class="olbl">${letters[oi]}.</span>${o}<span class="mark"></span>`;
    btn.onclick=()=>chooseOpt(host,tp,oi,btn,optWrap);
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);

  const ex=el("div","explain"); ex.id="exBox"; card.appendChild(ex);

  const nav=el("div","q-nav");
  const prev=el("button","btn btn-ghost","← ข้อก่อน");
  prev.disabled = i===0;
  prev.onclick=()=>{ state.quiz.idx--; renderQ(host,tp); };
  const next=el("button","btn btn-primary", i===tp.quiz.length-1?"ดูผลสรุป →":"ข้อถัดไป →");
  next.id="nextBtn"; next.disabled = state.quiz.answers[i]===null;
  next.onclick=()=>{
    if(i===tp.quiz.length-1) showResult(host,tp);
    else { state.quiz.idx++; renderQ(host,tp); }
  };
  nav.appendChild(prev); nav.appendChild(next);
  card.appendChild(nav);
  host.appendChild(card);

  // restore previous answer
  if(state.quiz.answers[i]!==null){
    replayAnswer(tp,i,optWrap);
  }
}

function chooseOpt(host,tp,choice,btn,optWrap){
  const i=state.quiz.idx;
  if(state.quiz.answers[i]!==null) return; // locked after answering
  state.quiz.answers[i]=choice;
  revealAnswer(tp,i,optWrap);
  $("#nextBtn").disabled=false;
}

function revealAnswer(tp,i,optWrap){
  const q=tp.quiz[i];
  const choice=state.quiz.answers[i];
  const opts=[...optWrap.querySelectorAll(".opt")];
  opts.forEach((b,oi)=>{
    b.disabled=true;
    if(oi===q.correct){ b.classList.add("correct"); b.querySelector(".mark").textContent="✓"; }
    if(oi===choice && choice!==q.correct){ b.classList.add("wrong"); b.querySelector(".mark").textContent="✕"; }
  });
  const ex=$("#exBox");
  const correct = choice===q.correct;
  ex.className="explain show "+(correct?"right":"miss");
  ex.innerHTML=`
    <div class="etag">${correct?"✓ ถูกต้อง":"ลองทบทวนอีกครั้ง"}</div>
    <div>${correct? q.ex.right : q.ex.miss}</div>
    <span class="lloref">อ้างอิง: ${q.llo}</span>`;
}

function replayAnswer(tp,i,optWrap){ revealAnswer(tp,i,optWrap); }

function showResult(host,tp){
  const total=tp.quiz.length;
  let correct=0;
  state.quiz.answers.forEach((a,i)=>{ if(a===tp.quiz[i].correct) correct++; });
  const pct=Math.round(correct/total*100);
  state.done[tp.code]=true;
  updateProgress(); refreshNavState();

  host.innerHTML="";
  const r=el("div","result");
  const circ=2*Math.PI*54;
  const off=circ*(1-correct/total);
  r.innerHTML=`
    <svg class="score-ring" viewBox="0 0 130 130">
      <circle cx="65" cy="65" r="54" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="11"/>
      <circle cx="65" cy="65" r="54" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
      <text x="65" y="60" text-anchor="middle" fill="#fff" font-size="30" font-family="Fraunces" font-weight="700">${pct}%</text>
      <text x="65" y="82" text-anchor="middle" fill="#cdeee6" font-size="13" font-family="IBM Plex Sans Thai">${correct}/${total} ข้อ</text>
    </svg>
    <h3>${pct>=80?"ยอดเยี่ยม! เข้าใจดีมาก":pct>=60?"ดีแล้ว! ทบทวนอีกนิด":"ลองทบทวนเนื้อหาอีกครั้งนะ"}</h3>
    <p>${pct>=80?"คุณเข้าใจหัวข้อนี้อย่างมั่นคง พร้อมนำไปใช้ในโครงร่างการวิจัยแล้ว":pct>=60?"พื้นฐานแน่นแล้ว ลองกลับไปอ่านข้อที่ตอบผิดเพื่อความเข้าใจที่สมบูรณ์":"แนะนำให้กลับไปทบทวนเนื้อหาในระยะ “ระหว่างเรียน” แล้วลองทำแบบฝึกหัดอีกครั้ง"}</p>
    <div class="breakdown">
      <div class="bd"><b>${correct}</b>ตอบถูก</div>
      <div class="bd"><b>${total-correct}</b>ตอบผิด</div>
      <div class="bd"><b>${total}</b>ทั้งหมด</div>
    </div>`;
  host.appendChild(r);

  const acts=el("div"); acts.style.cssText="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:8px";
  const retry=el("button","btn btn-ghost","↻ ทำแบบฝึกหัดอีกครั้ง");
  retry.onclick=()=>{ renderAfter($('.phase-panel[data-k="after"]'),tp); switchPhase("after"); };
  acts.appendChild(retry);

  const nextTopic=getNextTopic(tp.code);
  if(nextTopic){
    const nx=el("button","btn btn-primary",`ไปหัวข้อถัดไป: ${nextTopic.code} →`);
    nx.onclick=()=>openTopic(nextTopic.code);
    acts.appendChild(nx);
  } else {
    const hm=el("button","btn btn-primary","กลับหน้าหลัก →");
    hm.onclick=openHome; acts.appendChild(hm);
  }
  host.appendChild(acts);

  // assignment bridge
  const br=el("div","bridge");
  br.innerHTML=`
    <div class="tag">เชื่อมสู่งานมอบหมาย · รายงานฉบับที่ 3</div>
    <h4>นำไปใช้ในโครงร่างการวิจัยของคุณ</h4>
    <ul>
      <li><span class="ck">✓</span><span>${tp.before.target}</span></li>
      <li><span class="ck">✓</span><span>ตรวจสอบว่าส่วนนี้ในโครงร่างของคุณสอดคล้องกับ ${tp.llo.join(", ")} หรือยัง</span></li>
    </ul>`;
  host.appendChild(br);
  window.scrollTo({top:0,behavior:"smooth"});
}

function getNextTopic(code){
  const ch=chById(topicByCode(code).ch);
  const order=ch.topics;
  const idx=order.indexOf(code);
  if(idx>=0 && idx<order.length-1) return COURSE.topics[order[idx+1]];
  return null;
}

/* ---------------- MOBILE ---------------- */
function closeMobile(){ $("#rail").classList.remove("open"); $("#scrim").classList.remove("show"); }
$("#menuBtn").onclick=()=>{ $("#rail").classList.toggle("open"); $("#scrim").classList.toggle("show"); };
$("#scrim").onclick=closeMobile;
$("#homeBtn").onclick=openHome;

/* ---------------- INIT ---------------- */
buildNav();
updateProgress();
openHome();

</script>
</body>
</html>
